name: Publish Fedonev to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'fedonev/dist/**'
      - 'fedonev/tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check JavaScript and verify names
        run: |
          node --check fedonev/dist/app.js
          node --check fedonev/dist/names.js
          node --test fedonev/tests/names.test.cjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the browser application
        uses: actions/upload-pages-artifact@v4
        with:
          path: fedonev/dist

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
